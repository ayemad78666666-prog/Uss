<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayesha & Hammad - Uss</title>
<style>
body{margin:0;background:#fdf8f0;font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;width:90%;max-width:380px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);padding:20px;text-align:center;border:2px solid #d4af37}
h2{color:#8b4513;margin:5px 0;font-size:22px}
.small{font-size:10px;color:#888;letter-spacing:2px}
.divider{height:1px;background:#e8dcc3;margin:12px 0}
canvas{width:100%;height:100px;border:1.5px dashed #d4af37;border-radius:10px;background:#fffef8;touch-action:none}
img.sign{width:100%;max-height:100px;object-fit:contain;border:1px solid #e8dcc3;border-radius:10px;background:#fff}
button{padding:10px;border-radius:20px;border:none;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<p class="small">BISMILLAH</p>
<h2>حماد اور عائشہ </h2>
<p class="small">OUR NIKKAH - USS</p>

<div class="divider"></div>

<!-- AYESHA SIGN - FIXED -->
<p style="font-size:11px;font-weight:bold;text-align:left">AYESHA:</p>
<img src="https://i.ibb.co/XZSkbQ1V/IMG-20250519-WA0030.jpg" class="sign">
<p style="font-size:9px;color:green">✓ Signed</p>

<div class="divider"></div>

<!-- HAMMAD SIGN - WITH ERASER -->
<p style="font-size:11px;font-weight:bold;text-align:left">HAMMAD:</p>
<canvas id="c" width="300" height="120"></canvas>

<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="clearCanvas()" style="flex:1;background:#ffe0e0;color:#a00;border:1px solid #e88">🧹 Clear All</button>
<button id="eraserBtn" onclick="toggleEraser()" style="flex:1;background:#f0f0f0;border:1px solid #aaa">✏️ Pen Mode</button>
</div>

<button onclick="save()" style="width:100%;margin-top:12px;background:#d4af37;color:#fff">💍 Save Nikkah Sign</button>
<p id="msg" style="font-size:10px;color:#888;margin-top:8px">Sign with finger, if mistake use Eraser or Clear</p>

</div>

<script>
let c=document.getElementById('c'), x=c.getContext('2d'), d=false, eraser=false;

x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#000";

function clearCanvas(){
  x.clearRect(0,0,c.width,c.height);
  x.globalCompositeOperation="source-over";
  eraser=false;
  document.getElementById('eraserBtn').innerHTML="✏️ Pen Mode";
  document.getElementById('eraserBtn').style.background="#f0f0f0";
}

function toggleEraser(){
  eraser=!eraser;
  let btn=document.getElementById('eraserBtn');
  if(eraser){
    btn.innerHTML="🧹 Eraser ON";
    btn.style.background="#ffccaa";
    x.globalCompositeOperation="destination-out";
  } else {
    btn.innerHTML="✏️ Pen Mode";
    btn.style.background="#f0f0f0";
    x.globalCompositeOperation="source-over";
  }
}

function getPos(e){
  let r=c.getBoundingClientRect();
  let cx = e.touches? e.touches[0].clientX : e.clientX;
  let cy = e.touches? e.touches[0].clientY : e.clientY;
  return {x:(cx-r.left)*(c.width/r.width), y:(cy-r.top)*(c.height/r.height)}
}

c.addEventListener('mousedown',e=>{d=true;x.beginPath();let p=getPos(e);x.moveTo(p.x,p.y)});
c.addEventListener('mousemove',e=>{if(!d)return;x.lineWidth=eraser?25:2.5;let p=getPos(e);x.lineTo(p.x,p.y);x.stroke()});
window.addEventListener('mouseup',()=>{d=false;x.beginPath()});

c.addEventListener('touchstart',e=>{d=true;x.beginPath();let p=getPos(e);x.moveTo(p.x,p.y);e.preventDefault()},{passive:false});
c.addEventListener('touchmove',e=>{if(!d)return;x.lineWidth=eraser?25:2.5;let p=getPos(e);x.lineTo(p.x,p.y);x.stroke();e.preventDefault()},{passive:false});
c.addEventListener('touchend',()=>{d=false;x.beginPath()});

function save(){
  let data=c.toDataURL();
  let a=document.createElement('a');
  a.href=data; a.download='Hammad_Nikkah_Sign.png'; a.click();
  document.getElementById('msg').innerHTML="💗 Saved! MashaAllah";
}
</script>

</body>
  </html>
